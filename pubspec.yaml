name: linked_here
description: 'Find nearby LinkedIn profiles using Bluetooth'
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  bluetooth_low_energy: ^6.2.1
  cupertino_icons: ^1.0.8
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  flutter_appauth: ^12.0.0
  flutter_bloc: ^9.1.1
  http: ^1.6.0
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
